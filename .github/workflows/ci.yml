name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # 콘텐츠 형식·중복·카드 함정을 배포 전에 잡는다
      - run: npm run check
      - run: npm test
      - run: npm run build
